<header class="sticky top-0 z-10 border-b border-line bg-paper/95 backdrop-blur-md">
  <div
    class="mx-auto flex h-16 w-[calc(100%-32px)] items-center justify-between gap-3 nav:h-[76px] nav:w-[min(1240px,calc(100%-56px))] nav:gap-7"
  >
    <a
      routerLink="/"
      aria-label="MedPlant, accueil"
      class="flex shrink-0 items-center gap-2.5 rounded focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-clay"
    >
      <span
        aria-hidden="true"
        class="grid h-[34px] w-[34px] place-items-center rounded-full bg-forest text-leaf nav:h-[37px] nav:w-[37px]"
      >
        <svg viewBox="0 0 24 24" fill="none" class="h-[22px] w-[22px]">
          <path
            d="M19.5 4.5c-7.2.2-12.3 2.4-13.8 7.1-1 3.1.8 5.8 3.6 5.8 5.3 0 8.6-5.3 10.2-12.9Z"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <path
            d="M4 21c2.2-5.5 5.2-8.6 10.8-11.4"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      </span>
      <span class="font-display text-[19px] font-extrabold text-forest nav:text-[21px]"
        >med<span class="text-clay">plant</span></span
      >
    </a>

    <nav
      id="main-nav"
      aria-label="Navigation principale"
      class="absolute inset-x-0 top-16 flex-col border-b border-line bg-paper px-4 pt-[7px] pb-3.5 nav:static nav:mx-0 nav:ml-9 nav:flex nav:flex-row nav:items-center nav:gap-[31px] nav:border-0 nav:bg-transparent nav:p-0"
      [class.hidden]="!menuOpen()"
      [class.flex]="menuOpen()"
    >
      @for (link of links; track link.label) {
        <a
          routerLink="/"
          [fragment]="link.fragment"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="activeOptions"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()"
          class="relative border-b border-line py-3 text-[13px] font-semibold text-[#48554b] transition-colors hover:text-forest aria-[current=page]:text-forest nav:border-0 nav:py-0 after:absolute after:-bottom-7 after:inset-x-0 after:h-0.5 after:bg-clay after:content-[''] after:hidden nav:aria-[current=page]:after:block focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-clay"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-3">
      <form
        id="site-search"
        role="search"
        aria-label="Rechercher dans MedPlant"
        [formGroup]="searchForm"
        (ngSubmit)="onSearch()"
        class="absolute inset-x-4 top-16 h-[42px] items-center gap-2 border border-line bg-white px-3 text-[#899189] focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-clay nav:static nav:flex nav:h-[39px] nav:w-[205px] nav:rounded nav:border-[#dfe4da]"
        [class.hidden]="!searchOpen()"
        [class.flex]="searchOpen()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
          class="h-[19px] w-[19px] shrink-0 nav:h-4 nav:w-4"
        >
          <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7" />
          <path
            d="m16 16 4.5 4.5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
        <input
          type="search"
          formControlName="q"
          maxlength="100"
          autocomplete="off"
          placeholder="Rechercher…"
          aria-label="Rechercher un article ou une plante"
          class="min-w-0 flex-1 bg-transparent text-[12px] text-ink outline-none placeholder:text-[#899189]"
        />
      </form>

      <button
        type="button"
        aria-controls="site-search"
        [attr.aria-expanded]="searchOpen()"
        [attr.aria-label]="searchOpen() ? 'Fermer la recherche' : 'Ouvrir la recherche'"
        (click)="toggleSearch()"
        class="grid h-10 w-10 place-items-center rounded border border-line bg-white text-forest focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-clay nav:hidden"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="h-[19px] w-[19px]">
          <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7" />
          <path
            d="m16 16 4.5 4.5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </button>

      <button
        type="button"
        (click)="showAccountMessage()"
        class="min-h-[37px] rounded border border-forest bg-forest px-[11px] text-[10px] font-bold text-white transition-colors hover:bg-forest-deep focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-clay nav:min-h-[39px] nav:px-4 nav:text-xs"
      >
        Mon espace
      </button>

      <button
        type="button"
        aria-controls="main-nav"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
        (click)="toggleMenu()"
        class="grid h-10 w-10 place-items-center rounded border border-line bg-white text-forest focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-clay nav:hidden"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="h-[19px] w-[19px]">
          <path
            d="M4 7h16M4 12h16M4 17h16"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </div>

  <p
    aria-live="polite"
    class="mx-auto w-[calc(100%-32px)] text-[12px] text-moss nav:w-[min(1240px,calc(100%-56px))]"
  >
    @if (accountMessage()) {
      <span class="inline-block pb-3">{{ accountMessage() }}</span>
    }
  </p>
</header>
